name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v
      - run: pytest -v -m slow

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm install` y no `npm ci`: el lock se genera en Windows, donde npm no puede
      # resolver las variantes opcionales que solo existen en Linux (@emnapi/*, que
      # entran por los binarios nativos del build de Angular). `npm ci` exige que el
      # lock esté sincronizado exactamente y falla en el runner por dependencias que
      # la máquina de desarrollo no puede anotar. Se pierde algo de reproducibilidad
      # a cambio de un CI que corre; el lock igual fija las versiones de todo lo demás.
      - run: npm install --no-audit --no-fund
      - run: npx prettier --check "src/**/*.{ts,html,css}"
      - run: npm run build
      # Sin --watch: en un runner sin TTY el default ya es false, pero dejarlo escrito
      # evita que un cambio de default cuelgue el job para siempre.
      - run: npx ng test --watch=false
